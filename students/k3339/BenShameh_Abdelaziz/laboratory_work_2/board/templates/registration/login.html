{% extends 'board/base.html' %}
{% block title %}Log in{% endblock %}

{% block content %}
    <h1>Log in</h1>
    <form method="post" style="max-width: 400px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <p class="mt-3">No account yet? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
